<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#c9eef3">
<title>Sellora Seller Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Lora:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap">
</head><body>
<style>
/* Lotus pond: aqua water wash, frosted glass panels, pink lotus accents. Serif italic display over a soft serif body. */
:root{
  --bg:#c9eef3; --wash:radial-gradient(900px 520px at 8% 0%,rgba(255,255,255,.75),transparent 62%),radial-gradient(760px 520px at 92% 8%,rgba(190,238,222,.85),transparent 62%),radial-gradient(820px 620px at 0% 100%,rgba(250,188,214,.5),transparent 62%),radial-gradient(820px 620px at 100% 100%,rgba(200,184,246,.55),transparent 62%),linear-gradient(160deg,#b4e9f1,#d8f4f6 48%,#c6eee5);
  --veil:linear-gradient(rgba(240,253,255,.10),rgba(240,253,255,.10));
  --surface:rgba(255,255,255,.66); --surface-2:rgba(214,242,247,.6); --solid:#f3fcfd; --field:rgba(255,255,255,.78);
  --ink:#0b4656; --muted:#3d7080; --line:rgba(36,140,164,.26); --edge:rgba(255,255,255,.9);
  --side:rgba(255,255,255,.5); --side-ink:#2c6a7b; --side-on:#0a4556; --side-hover:rgba(255,255,255,.78);
  --accent:#0f86b0; --accent-ink:#ffffff; --accent-soft:rgba(15,134,176,.14); --grad:linear-gradient(135deg,#1b9fc6,#0d79a6);
  --pink:#e0609a; --pink-soft:rgba(240,138,180,.22);
  --ok:#157f59; --ok-soft:#d3f2e4; --warn:#9a5900; --warn-soft:#fdebc8; --bad:#c9365f; --bad-soft:#fddde7;
  --info:#0d78a8; --info-soft:#d0eefa; --purple:#7557c4; --purple-soft:#e8e0fa;
  --shadow:0 10px 32px rgba(30,138,164,.15),inset 0 1px 0 rgba(255,255,255,.85);
  --f-display:'Cormorant Garamond','Noto Serif Thai',Georgia,'Times New Roman',serif;
  --f-body:'Lora','Noto Serif Thai',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#05242d; --wash:radial-gradient(800px 520px at 8% 0%,rgba(60,190,215,.22),transparent 62%),radial-gradient(760px 520px at 92% 10%,rgba(70,200,170,.16),transparent 62%),radial-gradient(820px 620px at 0% 100%,rgba(240,120,170,.16),transparent 62%),radial-gradient(820px 620px at 100% 100%,rgba(150,120,230,.2),transparent 62%),linear-gradient(160deg,#04303b,#06232c 55%,#07303a);
  --veil:linear-gradient(rgba(3,32,42,.74),rgba(3,32,42,.74));
  --surface:rgba(14,74,90,.5); --surface-2:rgba(255,255,255,.07); --solid:#0b3744; --field:rgba(255,255,255,.07);
  --ink:#e2f8fb; --muted:#8fc4d0; --line:rgba(120,214,234,.22); --edge:rgba(160,232,246,.2);
  --side:rgba(5,36,46,.72); --side-ink:#8fc4d0; --side-on:#ffffff; --side-hover:rgba(255,255,255,.09);
  --accent:#62d9f0; --accent-ink:#04303a; --accent-soft:rgba(98,217,240,.16); --grad:linear-gradient(135deg,#7ae4f6,#3bb8dc);
  --pink:#f28cb8; --pink-soft:rgba(242,140,184,.2);
  --ok:#52dea2; --ok-soft:rgba(82,222,162,.16); --warn:#f8b75e; --warn-soft:rgba(248,183,94,.16); --bad:#ff8ca8; --bad-soft:rgba(255,140,168,.16);
  --info:#7fd2f7; --info-soft:rgba(127,210,247,.16); --purple:#bba5ff; --purple-soft:rgba(187,165,255,.16);
  --shadow:0 10px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#05242d; --wash:radial-gradient(800px 520px at 8% 0%,rgba(60,190,215,.22),transparent 62%),radial-gradient(760px 520px at 92% 10%,rgba(70,200,170,.16),transparent 62%),radial-gradient(820px 620px at 0% 100%,rgba(240,120,170,.16),transparent 62%),radial-gradient(820px 620px at 100% 100%,rgba(150,120,230,.2),transparent 62%),linear-gradient(160deg,#04303b,#06232c 55%,#07303a);
  --veil:linear-gradient(rgba(3,32,42,.74),rgba(3,32,42,.74));
  --surface:rgba(14,74,90,.5); --surface-2:rgba(255,255,255,.07); --solid:#0b3744; --field:rgba(255,255,255,.07);
  --ink:#e2f8fb; --muted:#8fc4d0; --line:rgba(120,214,234,.22); --edge:rgba(160,232,246,.2);
  --side:rgba(5,36,46,.72); --side-ink:#8fc4d0; --side-on:#ffffff; --side-hover:rgba(255,255,255,.09);
  --accent:#62d9f0; --accent-ink:#04303a; --accent-soft:rgba(98,217,240,.16); --grad:linear-gradient(135deg,#7ae4f6,#3bb8dc);
  --pink:#f28cb8; --pink-soft:rgba(242,140,184,.2);
  --ok:#52dea2; --ok-soft:rgba(82,222,162,.16); --warn:#f8b75e; --warn-soft:rgba(248,183,94,.16); --bad:#ff8ca8; --bad-soft:rgba(255,140,168,.16);
  --info:#7fd2f7; --info-soft:rgba(127,210,247,.16); --purple:#bba5ff; --purple-soft:rgba(187,165,255,.16);
  --shadow:0 10px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.65rem;line-height:1.15;font-weight:700}
h2{font-size:1.05rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:.82rem}
.right{text-align:right}

/* shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding:18px 12px;display:flex;flex-direction:column;gap:4px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;color:var(--side-on);font:700 1.25rem var(--f-display)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.navgrp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:14px 12px 4px;opacity:.6}
.navb{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;background:none;border-radius:9px;color:var(--side-ink);text-align:left;font-weight:500}
.navb:hover{background:var(--side-hover);color:var(--side-on)}
.navb[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.navb svg{flex:none}
.navb .cnt{margin-left:auto;font-size:.72rem;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:99px;color:inherit}
.side .foot{margin-top:auto;padding:12px;font-size:.78rem;opacity:.7}
.veil{display:none}

.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .menu-btn{display:none}
.sbox{position:relative;flex:1;max-width:460px}
.sbox input{width:100%;padding:9px 12px 9px 38px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.sbox>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow:auto}
.sres .grp{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 10px 2px}
.sres button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px}
.sres button:hover{background:var(--surface-2)}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px;position:relative}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.ibtn:hover{background:var(--surface-2)}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--bad);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 4px}
.who{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 10px 4px 4px;text-align:left}
.who:hover{background:var(--surface-2)}
.av{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.who b{display:block;line-height:1.1}
.who small{color:var(--muted)}
.dd{position:absolute;top:calc(100% + 8px);right:0;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(5,15,35,.25);padding:8px;z-index:50}
.dd .it{display:flex;gap:10px;padding:10px;border-radius:10px}
.dd .it:hover{background:var(--surface-2)}
.dd button.it{width:100%;border:0;background:none;text-align:left;align-items:center}
.dd hr{border:0;border-top:1px solid var(--line);margin:6px 0}

main{padding:26px 24px 48px;display:flex;flex-direction:column;gap:20px;min-width:0;max-width:1320px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{color:var(--muted);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card>.ch{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.grid{display:grid;gap:16px;min-width:0}
.stats{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g11{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .lb{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500}
.stat .lb i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal}
.stat .v{font:700 1.9rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .d{font-size:.8rem;color:var(--muted)}
.up{color:var(--ok);font-weight:600}
.tone-b{background:var(--info-soft);color:var(--info)}.tone-g{background:var(--ok-soft);color:var(--ok)}.tone-p{background:var(--purple-soft);color:var(--purple)}.tone-o{background:var(--warn-soft);color:var(--warn)}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn.icon{padding:6px;border-radius:8px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.inp,select.inp,textarea.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
textarea.inp{resize:vertical;min-height:84px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.84rem;min-width:0}
div.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;min-width:0}
div.f>label{font-weight:600}
label.f small{font-weight:400;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:7px;font-weight:500;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.chk input{accent-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.err{color:var(--bad);font-size:.82rem}
.err:empty{display:none}
.inp[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}

/* tables */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pcell{display:flex;align-items:center;gap:12px;min-width:0}
.thumb{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden;color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-Pending,.p-Pending,.warn{background:var(--warn-soft);color:var(--warn)}
.s-Processing,.info{background:var(--info-soft);color:var(--info)}
.s-Shipped,.purple{background:var(--purple-soft);color:var(--purple)}
.s-Completed,.p-Paid,.ok,.s-Active{background:var(--ok-soft);color:var(--ok)}
.s-Cancelled,.p-Refunded,.bad,.s-Expired{background:var(--bad-soft);color:var(--bad)}
.s-Paused{background:var(--surface-2);color:var(--muted)}
.stock-low{color:var(--warn);font-weight:700}.stock-out{color:var(--bad);font-weight:700}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li button.lnk{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%}
.li button.lnk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:34px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.tl li{position:relative;padding:0 0 18px 34px;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li i{position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.tl li.done{color:var(--ink)}
.tl li.done i{background:var(--ok);border-color:var(--ok)}
.tl li.done::before{background:var(--ok)}
.tl li.now i{border-color:var(--accent);background:var(--accent-soft)}
.tl li.now{color:var(--ink);font-weight:600}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{display:grid;grid-template-columns:130px minmax(0,1fr) 90px;gap:12px;align-items:center}
.fstep .fb{height:30px;border-radius:8px;background:var(--accent);min-width:6px}
.fstep:nth-child(2) .fb{opacity:.82}.fstep:nth-child(3) .fb{opacity:.64}.fstep:nth-child(4) .fb{background:var(--ok);opacity:1}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(5,12,28,.55);display:grid;place-items:center;padding:16px;z-index:100;overflow-y:auto}
.modal{background:var(--surface);border-radius:16px;width:min(720px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);margin:auto}
.modal.narrow{width:min(440px,100%)}
.modal>.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal>.mb{padding:20px;display:flex;flex-direction:column;gap:16px}
.modal>.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.profit{padding:10px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.profit.neg{background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}

/* login */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.lbrand{background:var(--side);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.lbrand h1{font-size:clamp(2rem,4vw,3rem);max-width:14ch;line-height:1.05}
.lbrand p{color:#b9c8e0;max-width:38ch}
.lmini{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:440px}
.lmini div{background:rgba(255,255,255,.07);border-radius:12px;padding:12px}
.lmini b{display:block;font:700 1.25rem var(--f-display)}
.lmini span{font-size:.78rem;color:#b9c8e0}
.lform{display:grid;place-items:center;padding:32px 16px}
.lform form{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}

@media (max-width:1100px){
  .shell{grid-template-columns:72px minmax(0,1fr)}
  .side{padding:14px 8px;align-items:center}
  .side .brand span,.navb span,.navgrp,.side .foot,.navb .cnt{display:none}
  .navb{justify-content:center;padding:10px;width:auto}
  .brand{padding:4px 0 14px}
  .g21{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;align-items:stretch;transform:translateX(-100%);transition:transform .2s}
  .side .brand span,.navb span,.navgrp,.side .foot{display:revert}
  .navb{justify-content:flex-start;width:100%}
  .navgrp{display:block}
  body.nav-open .side{transform:none}
  body.nav-open .veil{display:block;position:fixed;inset:0;background:rgba(5,12,28,.5);z-index:35}
  .top .menu-btn{display:grid}
  .top{padding:10px 16px;gap:8px}
  .who>span:not(.av){display:none}.who{padding:4px}
  main{padding:20px 16px 40px}
  .g11{grid-template-columns:minmax(0,1fr)}
  .tw{margin:0 -14px;padding:0 14px}
  .card{padding:14px}
  .login{grid-template-columns:minmax(0,1fr)}
  .lbrand{padding:28px 20px}

<style>
.dn{color:var(--bad);font-weight:600}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 84px 90px 36px;gap:8px;align-items:center}

.cl{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.cl li{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

<style>
/* ---- lotus pond layer ---- */
body{font-family:var(--f-body);font-size:15px;line-height:1.55;background-color:var(--bg);background-image:var(--wash);background-attachment:fixed;background-repeat:no-repeat;color:var(--ink)}
.num,.stat .v,td,th{font-variant-numeric:lining-nums tabular-nums}
h1,h2,h3{font-family:var(--f-display);letter-spacing:0;color:var(--ink)}
h1{font-size:clamp(1.9rem,4.2vw,2.5rem);font-weight:600;font-style:italic;line-height:1.1}
h2{font-size:1.45rem;font-weight:700;line-height:1.15}
h3{font-size:1.2rem;font-weight:700}
.head p{font-style:italic}

.shell{position:relative;z-index:1}
.deco{position:fixed;pointer-events:none;z-index:0;color:#fff}
.deco svg{display:block;width:100%;height:100%}
.d1{width:300px;height:300px;left:-90px;bottom:-80px;opacity:.7;transform:rotate(20deg)}
.d2{width:210px;height:170px;left:30px;bottom:-14px;opacity:.9}
.d3{width:320px;height:320px;right:-110px;top:-110px;opacity:.55;transform:rotate(-30deg)}
.d4{width:190px;height:150px;right:20px;bottom:-12px;opacity:.85}
.d5{width:150px;height:150px;right:200px;bottom:-60px;opacity:.5;transform:rotate(60deg)}

:root[data-theme="dark"] .deco{opacity:.28}

.card{border-radius:26px;border:1px solid var(--edge);background:var(--surface);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}

.brand{font-family:var(--f-display);font-size:1.8rem;font-weight:600}

.navgrp{color:var(--side-ink);opacity:.8}

.navb[aria-current="page"] .cnt{background:rgba(255,255,255,.28);color:#fff}
.top{background:color-mix(in srgb,var(--bg) 45%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--edge)}
.sbox input,.inp,select.inp{background-color:var(--field);border:1px solid var(--line);border-radius:999px;padding:10px 18px;color:var(--ink)}
.sbox input{padding-left:42px}
textarea.inp{border-radius:22px}
.inp:focus,.sbox input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.inp[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
select.inp{padding-right:36px}
.ibtn{border-radius:50%;background:var(--surface);border:1px solid var(--edge)}
.who{border-radius:999px;background:var(--surface);border:1px solid var(--edge)}
.av{border-radius:50%;background:var(--grad);color:#fff}
.btn{border-radius:999px;background:var(--surface);border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 8px rgba(30,138,164,.1);padding:9px 18px;font-weight:600;color:var(--ink)}
.btn:hover{background:var(--solid)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px rgba(15,134,176,.32);text-shadow:0 1px 1px rgba(5,60,85,.25)}
.btn.pri:hover{filter:brightness(1.07);background:var(--grad)}
:root[data-theme="dark"] .btn.pri{color:var(--accent-ink);text-shadow:none}

.btn.sm{padding:5px 13px}.btn.icon{padding:7px;border-radius:50%}

.seg{border-radius:999px;background:var(--surface-2);border:1px solid var(--edge)}

.seg button[aria-pressed="true"]{background:var(--solid);color:var(--ink);box-shadow:0 2px 8px rgba(30,138,164,.18)}
.chk{border-radius:999px;background:var(--field)}
.thumb{border-radius:16px}
.pill{font-weight:600}
th{font-family:var(--f-body);color:var(--muted)}
tbody tr.click:hover td{background:var(--accent-soft)}

.profit{border-radius:18px}

.lbrand h1 em{font-weight:600;background:linear-gradient(90deg,#1b9fc6,#8a6fd1 70%,#d36ba6);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em}

  const now=new Date(),dd=day||todayISO(),dp=dd.split('-').map(Number);
  const ts=eo&&isoDay(eo.ts)===dd?eo.ts:(dd===todayISO()?Date.now():new Date(dp[0],dp[1]-1,dp[2],now.getHours(),now.getMinutes(),now.getSeconds()).getTime());

  if(y>2400)y-=543;const t=new Date(y,m-1,d);if(t.getFullYear()!==y||t.getMonth()!==m-1||t.getDate()!==d)return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}

function emailError(v){
  v=v.trim();if(!v)return 'Enter your email address.';
  if(/\s/.test(v))return 'The email has a space in it. Remove the space.';
  const n=(v.match(/@/g)||[]).length;
  if(n===0)return 'The email is missing "@". It should look like name@gmail.com.';
  if(n>1)return 'The email has more than one "@". Keep only one.';
  const p=v.split('@');
  if(!p[0])return 'Add your name before the "@", for example name@gmail.com.';
  if(!p[1])return 'Add the domain after the "@", for example gmail.com.';
  if(p[1].indexOf('.')<0)return 'The part after "@" needs a dot, like gmail.com or psu.ac.th.';
  if(/^\.|\.$|\.\./.test(p[1]))return 'The part after "@" has a misplaced dot. Check it, for example gmail.com.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s.]{2,}$/.test(v))return 'The ending of the email looks too short. Check it, for example .com or .th.';
  return '';}
