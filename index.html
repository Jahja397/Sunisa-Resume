<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MYHOLO ✦ Y2K Space</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Pixelify+Sans:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading"><h2>MYHOLO ✦</h2><p>connecting...</p></div>

  <header class="nav hidden" id="navbar">
    <div class="nav-inner">
      <div class="logo" onclick="goPage('home')">✦ MYHOLO</div>
